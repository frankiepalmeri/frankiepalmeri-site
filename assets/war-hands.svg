<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Support emblem">
  <title>Support the war effort</title>
  <defs>
    <linearGradient id="sealBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#182030"/>
      <stop offset="100%" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#b8c2d0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8d078"/>
      <stop offset="100%" stop-color="#b89220"/>
    </linearGradient>
  </defs>

  <!-- corporate seal -->
  <circle cx="160" cy="100" r="88" fill="url(#sealBg)"/>
  <circle cx="160" cy="100" r="88" fill="none" stroke="#c9a227" stroke-width="2.5"/>
  <circle cx="160" cy="100" r="80" fill="none" stroke="#c9a227" stroke-width="0.75" opacity="0.4"/>

  <!-- LEFT hand: elegant open palm silhouette (receiving) -->
  <path fill="url(#metal)" d="
    M 86 145
    C 86 132, 96 124, 110 124
    L 132 124
    C 142 124, 148 130, 148 138
    L 148 146
    C 148 152, 143 156, 136 156
    L 108 156
    C 94 156, 86 150, 86 145 Z"/>
  <!-- left fingers — slender rounded -->
  <g fill="url(#metal)">
    <rect x="92" y="98" width="9" height="30" rx="4.5"/>
    <rect x="104" y="94" width="9" height="34" rx="4.5"/>
    <rect x="116" y="96" width="9" height="32" rx="4.5"/>
    <rect x="128" y="100" width="8" height="28" rx="4"/>
  </g>
  <!-- left thumb -->
  <path fill="url(#metal)" d="M 136 130 C 150 124, 158 130, 158 138 C 158 146, 150 150, 140 148 L 136 144 Z"/>

  <!-- RIGHT hand mirror -->
  <path fill="url(#metal)" d="
    M 234 145
    C 234 132, 224 124, 210 124
    L 188 124
    C 178 124, 172 130, 172 138
    L 172 146
    C 172 152, 177 156, 184 156
    L 212 156
    C 226 156, 234 150, 234 145 Z"/>
  <g fill="url(#metal)">
    <rect x="219" y="98" width="9" height="30" rx="4.5"/>
    <rect x="207" y="94" width="9" height="34" rx="4.5"/>
    <rect x="195" y="96" width="9" height="32" rx="4.5"/>
    <rect x="184" y="100" width="8" height="28" rx="4"/>
  </g>
  <path fill="url(#metal)" d="M 184 130 C 170 124, 162 130, 162 138 C 162 146, 170 150, 180 148 L 184 144 Z"/>

  <!-- floating $ marks — geometric, flat gold (bank emblem) -->
  <g fill="url(#gold)">
    <!-- center -->
    <g transform="translate(160 70) scale(1.05)">
      <path d="M-2.5,-20 h5 v5.5
        c12,1.5 15.5,8 15.5,15.5 c0,10 -8.5,13.5 -18,15.5
        v7 c7,-1 12,-3.5 12,-10.5 h5
        c0,12 -8.5,17 -17,18.5 v7 h-5 v-7
        c-12,-1.5 -15.5,-8 -15.5,-15.5 c0,-10 8.5,-13.5 18,-15.5
        v-7 c-7,1 -12,3.5 -12,10.5 h-5
        c0,-12 8.5,-17 17,-18.5 z"/>
    </g>
    <!-- left -->
    <g transform="translate(122 56) scale(0.68)">
      <path d="M-2.5,-20 h5 v5.5
        c12,1.5 15.5,8 15.5,15.5 c0,10 -8.5,13.5 -18,15.5
        v7 c7,-1 12,-3.5 12,-10.5 h5
        c0,12 -8.5,17 -17,18.5 v7 h-5 v-7
        c-12,-1.5 -15.5,-8 -15.5,-15.5 c0,-10 8.5,-13.5 18,-15.5
        v-7 c-7,1 -12,3.5 -12,10.5 h-5
        c0,-12 8.5,-17 17,-18.5 z"/>
    </g>
    <!-- right -->
    <g transform="translate(198 56) scale(0.68)">
      <path d="M-2.5,-20 h5 v5.5
        c12,1.5 15.5,8 15.5,15.5 c0,10 -8.5,13.5 -18,15.5
        v7 c7,-1 12,-3.5 12,-10.5 h5
        c0,12 -8.5,17 -17,18.5 v7 h-5 v-7
        c-12,-1.5 -15.5,-8 -15.5,-15.5 c0,-10 8.5,-13.5 18,-15.5
        v-7 c-7,1 -12,3.5 -12,10.5 h-5
        c0,-12 8.5,-17 17,-18.5 z"/>
    </g>
  </g>

  <!-- subtle base rail -->
  <rect x="132" y="170" width="56" height="2.5" rx="1.25" fill="#c9a227" opacity="0.75"/>
</svg>
