  <path d="M800 0 L752 0 L800 48 Z" fill="#ff1a1a"/>
  <path d="M0 450 L48 450 L0 402 Z" fill="#ff1a1a"/>
  <path d="M800 450 L752 450 L800 402 Z" fill="#ff1a1a"/>
