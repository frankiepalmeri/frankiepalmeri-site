  <rect x="60" y="0" width="8" height="18" fill="#c40000"/>
  <rect x="732" y="0" width="8" height="18" fill="#c40000"/>
  <rect x="60" y="432" width="8" height="18" fill="#c40000"/>
  <rect x="732" y="432" width="8" height="18" fill="#c40000"/>
  <!-- emblem accent diamonds -->
  <polygon points="400,6 412,18 400,30 388,18" fill="#ff1a1a"/>
  <polygon points="400,420 412,432 400,444 388,432" fill="#ff1a1a"/>
